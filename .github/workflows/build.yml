name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Self-test (no device expected in CI)
        shell: powershell
        run: |
          dist\TrayTVAdmin.exe --selftest
          Get-Content local\logs\selftest.log -ErrorAction SilentlyContinue
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: TrayTVAdmin-windows
          path: dist/TrayTVAdmin.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrayTVAdmin.exe
