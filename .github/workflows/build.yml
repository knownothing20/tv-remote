name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build TrayTVAdmin.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Verify executable and embedded panel
        shell: cmd
        run: dist\TrayTVAdmin.exe --selftest

      - name: Check self-test result
        shell: powershell
        run: |
          dist\TrayTVAdmin.exe --selftest
          $report = Get-Content local\logs\selftest.log -Raw | ConvertFrom-Json
          if (-not $report.backend_started -or -not $report.port_open -or -not $report.tray_menu_ok) {
            throw "Executable self-test failed"
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrayTVAdmin.exe
