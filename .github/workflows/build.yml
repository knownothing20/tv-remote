name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build TrayTVAdmin.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: Verify executable and embedded panel
        shell: powershell
        run: |
          # Windows GUI 子进程会异步返回，必须等待自检写完日志。
          $process = Start-Process -FilePath "dist\TrayTVAdmin.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-test exited with $($process.ExitCode)" }
          $report = Get-Content local\logs\selftest.log -Raw | ConvertFrom-Json
          if (-not $report.backend_started -or -not $report.port_open -or -not $report.tray_menu_ok) {
            throw "Executable self-test failed"
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrayTVAdmin.exe
